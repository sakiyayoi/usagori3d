<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffe9f2"><title>うさぎ、ゴリラを殴る。3D v3</title>
<style>

:root{--ink:#603b32;--paper:#fff7e6;--pink:#fa78a6;--orange:#ff984f;--yellow:#ffdf61;--edge:3px solid var(--ink);--shadow:0 5px 0 var(--ink)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none;background:#ecc6cc;color:var(--ink);font-family:"Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Hiragino Sans",sans-serif;font-weight:800}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;border:var(--edge);transition:scale .1s,translate .1s}button:focus-visible{outline:3px solid var(--orange);outline-offset:4px}button:disabled{cursor:default}button:active:not(:disabled){translate:0 3px;scale:.94}[hidden]{display:none!important}
#game{height:100%;height:100dvh;max-width:660px;margin:auto;position:relative;overflow:hidden;background:var(--paper)}
#stage,#world{position:absolute;inset:0}#stage{background:linear-gradient(#ffe9f2,#fff7e6);isolation:isolate}canvas{display:block;width:100%;height:100%;touch-action:none}
/* Independent stickers over a single, full-screen world. These wrappers have no surface. */
#hud{position:absolute;inset:0;z-index:3;pointer-events:none}.hearts{position:absolute;top:23px;left:13px;font-size:27px;letter-spacing:-1px;color:var(--pink);-webkit-text-stroke:1px var(--ink);paint-order:stroke fill;filter:drop-shadow(0 2px 0 var(--paper));white-space:nowrap}.hearts.pop{animation:heart-pop .18s steps(4)}
.score{position:absolute;top:12px;left:50%;margin-left:-68px;width:136px;height:96px;display:flex;align-items:center;justify-content:center;isolation:isolate;transform:rotate(-4deg)}.score:before{content:"";position:absolute;inset:-5px -2px;background:var(--yellow);border:var(--edge);border-radius:41% 44% 35% 43%;box-shadow:var(--shadow);z-index:-1}.score b{font-size:76px;line-height:1;font-weight:1000;letter-spacing:-.075em;padding-right:5px;font-variant-numeric:tabular-nums;text-shadow:3px 3px var(--paper)}.score.pop{animation:score-pop .18s steps(4)}
.timer{position:absolute;right:14px;top:13px;width:59px;height:59px;display:flex;align-items:center;justify-content:center;gap:1px;border:var(--edge);border-radius:50%;background:var(--paper);box-shadow:0 3px 0 var(--ink);transform:rotate(5deg);font-size:27px;font-variant-numeric:tabular-nums}.timer small{font-size:11px;align-self:center}.timer.danger{background:#d94d4c;color:var(--paper)}
.tools{position:absolute;right:10px;top:83px;display:flex;gap:7px;pointer-events:auto}.tools button{width:44px;height:44px;padding:0;border-width:2px;border-radius:50%;background:var(--paper);font-size:22px;box-shadow:0 3px 0 var(--ink)}.tools svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}#mute[aria-pressed=false] .sound-off,#mute[aria-pressed=true] .sound-on{display:none}
.health{position:absolute;top:140px;left:24px;right:24px;height:28px}.track{border:2px solid var(--ink);border-radius:30px;overflow:hidden;background:#f1d4bd;box-shadow:0 2px 0 #603b3240}.track i{display:block;height:100%;width:100%;transition:width .12s steps(3);background:var(--pink)}.health .track{height:100%;border-width:3px}.health-title{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:space-between}.health-title #phaseLabel{background:var(--orange);border:2px solid var(--ink);border-radius:9px 5px 10px 5px;font-size:12px;padding:5px 8px;margin-left:-10px;transform:rotate(-4deg);box-shadow:0 2px 0 var(--ink)}#hpText{font-size:17px;padding:1px 9px;margin-right:5px;background:var(--paper);border-radius:12px;line-height:1;font-variant-numeric:tabular-nums}
.zone{position:absolute;top:184px;left:16px;font-size:13px;padding:6px 10px;border:2px solid var(--ink);border-radius:30px;background:var(--paper);transform:rotate(-2deg);box-shadow:0 2px 0 var(--ink);white-space:nowrap}.zone[data-zone=back]{background:var(--yellow)}
.stun{position:absolute;top:188px;right:15px;display:flex;align-items:center;gap:5px;width:100px;height:25px;padding:3px 6px;background:var(--paper);border:2px solid var(--ink);border-radius:30px;transform:rotate(3deg);box-shadow:0 2px 0 var(--ink);pointer-events:none}.stun>span{font-size:17px;line-height:1}.stun .track{flex:1;height:10px;box-shadow:none}.stun i{background:var(--yellow)}
#combo{position:absolute;top:40%;left:16px;z-index:2;transform:rotate(-10deg);min-width:63px;padding:5px 9px 8px;background:var(--pink);border:var(--edge);border-radius:41% 33% 36% 30%;box-shadow:0 4px 0 var(--ink);font-size:45px;line-height:.95;text-align:center;font-weight:1000;pointer-events:none}#combo:after{content:"COMBO";display:block;font-size:11px;line-height:1.4;letter-spacing:.02em}
#enemyCue{position:absolute;top:236px;left:50%;translate:-50% 0;width:max-content;max-width:calc(100% - 20px);text-align:center;white-space:nowrap;font-size:13px;line-height:1.3;color:var(--paper);background:#d94d4c;border:var(--edge);border-radius:12px 18px 10px 16px;box-shadow:0 4px 0 var(--ink);padding:9px 10px;pointer-events:none;transform:rotate(-2deg);z-index:4}#enemyCue:empty{display:none}#enemyCue.pop{animation:cue-pop .28s cubic-bezier(.2,1.5,.5,1)}
#callout,#stamp{display:none!important}.floaters{position:absolute;inset:0;overflow:visible;pointer-events:none;z-index:5}.float{position:absolute;font-size:28px;font-weight:1000;white-space:nowrap;color:var(--paper);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:2px 3px var(--ink);transform:translate(-50%,-50%) rotate(var(--tilt,0deg));line-height:1.2}.float small{display:none}.float.crit{color:var(--yellow);font-size:35px}.float.crit:before{content:"";position:absolute;inset:-5px 0;background:var(--orange);border:2px solid var(--ink);border-radius:42% 32% 45% 30%;z-index:-1;transform:rotate(-12deg)}.float.break{color:var(--orange);font-size:34px}.float.collect{color:var(--yellow);font-size:30px;z-index:7}
#controls{position:absolute;inset:auto 0 0;height:280px;padding-bottom:env(safe-area-inset-bottom);z-index:6;pointer-events:none;background:linear-gradient(transparent 0%,#fff7e600 23%,#fff7e6b3 74%,#fff7e6ed 100%)}#controls button{pointer-events:auto}
.attacks,.orbit-row{position:absolute;inset:0}.attack{position:absolute;overflow:hidden;border:var(--edge);box-shadow:0 6px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px 3px}.attack strong{font-size:15px;font-weight:950;z-index:1;white-space:nowrap}.attack .symbol{height:33px;z-index:1}.symbol svg{width:43px;height:33px;overflow:visible;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}.attack:disabled{filter:saturate(.8)}.cool{position:absolute;inset:0;background:#603b323d;transform-origin:bottom;pointer-events:none}
#dash{left:4%;bottom:108px;width:25%;height:86px;background:#ffb1cb;border-radius:33% 38% 27% 32%;transform:rotate(-2deg)}#slap{left:32%;bottom:87px;width:27%;height:94px;background:#ffd2df;border-radius:31% 27% 35% 30%;transform:rotate(1deg)}#cannon{right:4%;bottom:117px;width:33%;height:117px;background:var(--orange);border-radius:39% 34% 31% 27%;transform:rotate(-1deg)}#cannon .symbol{height:43px}#cannon .symbol svg{width:54px;height:43px}#cannon strong{font-size:17px}#cannonHint{position:absolute;top:14px;left:50%;translate:-50% 0;font-size:29px;line-height:40px;z-index:2;font-variant-numeric:tabular-nums}#cannon[data-count=true] .symbol{visibility:hidden}
.orbit{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));width:66px;height:66px;background:var(--yellow);border-radius:50%;box-shadow:0 5px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;font-size:11px}#left{left:14px;transform:rotate(-7deg)}#right{right:14px;transform:rotate(7deg)}.orbit svg{width:31px;height:29px;fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.gauge-row{position:absolute;bottom:calc(31px + env(safe-area-inset-bottom));left:50%;translate:-50% 0;width:47%;height:31px;display:flex;align-items:center;gap:5px;padding:4px 7px;background:var(--paper);border:2px solid var(--ink);border-radius:24px;transform:rotate(-2deg)}.moon-icon{flex:none;width:22px;height:24px;fill:var(--yellow);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}.gauge-row .track{flex:1;height:12px;box-shadow:none}.gauge-row i{background:var(--yellow)}#gaugeText{font-size:12px;min-width:31px;font-variant-numeric:tabular-nums;text-align:right}
#special{position:absolute;bottom:213px;left:50%;margin-left:-48px;width:96px;height:96px;padding:0;border:0;background:none;filter:drop-shadow(0 4px 0 var(--ink));animation:ready .65s steps(3) infinite;isolation:isolate}#special svg{position:absolute;inset:0;width:100%;height:100%;z-index:-1;fill:var(--yellow);stroke:var(--ink);stroke-width:3;stroke-linejoin:round}#special strong{font-size:22px;text-shadow:1px 1px var(--paper)}
.overlay{position:absolute;inset:0;z-index:10;display:flex;align-items:center;flex-direction:column;padding:26px 24px;overflow:auto}.primary{width:100%;max-width:390px;min-height:66px;background:var(--orange);color:var(--ink);border:var(--edge);box-shadow:var(--shadow);border-radius:30px 25px 31px 23px;font-size:24px;font-weight:950;pointer-events:auto}.secondary{border:var(--edge);background:var(--paper);border-radius:19px;box-shadow:0 3px 0 var(--ink);min-height:48px;padding:8px 15px;font-size:14px}
#title{background:linear-gradient(#ffe9f2aa,transparent 36%,transparent 68%,#fff7e6ee 92%);justify-content:space-between;pointer-events:none;text-align:center;overflow:hidden}.title-head{padding-top:2vh;width:100%}.title-head h1{font-size:clamp(36px,9.2vw,58px);line-height:1.22;letter-spacing:-.06em;margin:13px 0 10px;font-weight:1000}.title-head h1 span{display:table;margin:0 auto 9px;padding:7px 19px 9px;background:#ff91b8;border:3px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink);transform:rotate(-4deg);color:var(--paper);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:1px 3px 0 var(--ink)}.title-head h1 span+span{background:var(--yellow);transform:rotate(3deg);font-size:.92em}.title-head h1 em{font-style:normal;color:#ffb16a}.title-bottom{width:100%;padding-bottom:3vh}.title-bottom p{display:table;margin:0 auto 18px;font-size:14px;background:var(--paper);padding:6px 13px;border:2px solid var(--ink);border-radius:18px;transform:rotate(2deg)}#title .primary{transform:rotate(-2deg)}.loading{font-size:13px;background:var(--paper);border:2px solid var(--ink);border-radius:15px;margin:16px 0;padding:7px;line-height:1.6}
#result{justify-content:center;text-align:center;background-color:#ffe9f2;background-image:radial-gradient(#fff7e6 3px,transparent 3px);background-size:26px 26px;gap:0}#resultTitle{font-size:25px;line-height:1.3;margin:9px 0 17px;background:#ffb1cb;border:var(--edge);border-radius:20px;padding:10px 16px;box-shadow:var(--shadow);transform:rotate(2deg);position:relative;max-width:100%}#resultTitle:before,#resultTitle:after{content:"";position:absolute;width:26px;height:21px;bottom:-12px;border:3px solid var(--ink);border-radius:8px 8px 12px 12px;background:var(--orange);z-index:-1}#resultTitle:before{left:10px;transform:rotate(18deg)}#resultTitle:after{right:10px;transform:rotate(-18deg)}.result-score{background:var(--yellow);border:var(--edge);border-radius:42% 38% 41% 39%;box-shadow:var(--shadow);width:174px;padding:16px 0 19px;margin:6px 0 25px;transform:rotate(-4deg)}.result-score b{font-size:88px;line-height:1;letter-spacing:-.07em;text-shadow:3px 3px var(--paper)}.result-score svg{width:24px;height:24px;stroke:var(--ink);stroke-width:2.6;fill:var(--paper);vertical-align:bottom;margin-bottom:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;width:100%;max-width:380px;gap:14px 15px;margin:0 0 26px}.stat{display:grid;grid-template-columns:28px 1fr;grid-template-rows:18px 30px;align-items:center;column-gap:6px;border:var(--edge);border-radius:23px 19px 22px 18px;padding:9px 10px;background:var(--paper);box-shadow:0 4px 0 var(--ink);transform:rotate(-3deg)}.stat:nth-child(2){transform:rotate(3deg) translateY(5px);background:#ffd2df}.stat:nth-child(3){transform:rotate(2deg);background:#ffe1a0}.stat:nth-child(4){transform:rotate(-2deg) translateY(4px)}.stat svg{grid-row:1/3;width:27px;height:29px;stroke:var(--ink);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;fill:none}.stat dt{font-size:12px;line-height:1.2;text-align:left}.stat dd{margin:0;font-size:27px;text-align:left;line-height:1.15;font-weight:950}.stat:last-child dd{font-size:21px;color:#be4770}#retry{transform:rotate(-1deg)}#share{margin:15px 0 4px;transform:rotate(1deg)}#shareText{flex-shrink:0;width:100%;min-height:102px;font-size:13px;font-family:inherit;color:var(--ink);background:var(--paper);border:var(--edge);border-radius:18px;box-shadow:var(--shadow);padding:12px;margin-top:12px;touch-action:auto}#result:has(#shareText:not([hidden])){justify-content:flex-start}
#pausePanel{justify-content:center;gap:27px;background:#fff7e6ee;text-align:center}#pausePanel h2{font-size:32px;background:var(--yellow);border:var(--edge);border-radius:24px;padding:15px;box-shadow:var(--shadow);transform:rotate(-3deg)}#error{position:absolute;bottom:3px;left:3px;max-height:100px;overflow:auto;z-index:30;background:#a83c36;color:white;white-space:pre-wrap;font:12px/1.4 monospace;padding:6px;max-width:calc(100% - 6px)}
#game[data-screen=title] #hud,#game[data-screen=title] #controls,#game[data-screen=title] #combo,#game[data-screen=title] .stun,#game[data-screen=title] #enemyCue{visibility:hidden}
.badge-spark{position:absolute;width:20px;height:20px;background:var(--yellow);border:2px solid var(--ink);border-radius:30%;rotate:45deg;pointer-events:none;z-index:9;animation:sparkle .5s steps(5) forwards}
@keyframes ready{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}@keyframes score-pop{0%{transform:rotate(-4deg) scale(.9,1.1)}55%{transform:rotate(-4deg) scale(1.12,.94)}100%{transform:rotate(-4deg) scale(1)}}@keyframes heart-pop{50%{transform:scale(1.13,.86) rotate(-3deg)}}@keyframes cue-pop{0%{scale:.65;opacity:0}65%{scale:1.07;opacity:1}100%{scale:1}}@keyframes sparkle{0%{scale:.5;opacity:0}30%{scale:1.25;opacity:1}100%{scale:.8;opacity:0;translate:0 -16px}}.tap-pop{animation:tap-pop .16s steps(4)}@keyframes tap-pop{50%{scale:.94;translate:0 2px}}
@media(max-width:360px),(max-height:650px){.hearts{font-size:22px;left:10px;top:21px}.score{width:112px;height:77px;margin-left:-56px;top:10px}.score b{font-size:61px}.timer{top:8px;right:11px;width:48px;height:48px;font-size:22px}.tools{top:64px;right:9px;gap:5px}.health{top:116px;left:19px;right:19px;height:25px}.health-title #phaseLabel{font-size:11px;padding:4px 6px}#hpText{font-size:15px}.zone{top:149px;left:11px;font-size:11px;padding:5px 7px}.stun{top:152px;right:12px;width:86px;height:24px}#enemyCue{top:181px;font-size:11px;padding:7px 6px;max-width:calc(100% - 12px)}#combo{font-size:34px;min-width:54px;left:12px;top:43%}
#controls{height:230px}#dash{left:3%;bottom:97px;width:25%;height:78px}#slap{left:31%;bottom:77px;width:28%;height:85px}#cannon{right:3%;bottom:107px;width:34%;height:103px}.attack strong{font-size:12px}.attack .symbol{height:29px}.symbol svg{width:37px;height:29px}#cannon .symbol{height:36px}#cannon .symbol svg{width:46px;height:36px}#cannon strong{font-size:14px}#cannonHint{top:10px;font-size:26px}.orbit{width:60px;height:60px;bottom:13px}#left{left:10px}#right{right:10px}.gauge-row{width:49%;bottom:27px;padding:4px 5px;gap:4px}#gaugeText{font-size:11px;min-width:28px}.moon-icon{width:19px}#special{width:74px;height:74px;margin-left:-37px;bottom:164px}#special strong{font-size:19px}
.overlay{padding:17px 18px}.title-head{padding-top:0}.title-head h1{font-size:33px;margin-top:7px}.title-head h1 span{padding:5px 15px 7px}.title-bottom{padding-bottom:1vh}.title-bottom p{font-size:12px;margin-bottom:14px}.primary{min-height:55px;font-size:21px}#resultTitle{font-size:21px;margin:5px 0 14px;padding:8px 12px}.result-score{width:142px;padding:10px 0 13px;margin:5px 0 18px}.result-score b{font-size:68px}.result-score svg{width:20px;height:20px}.stats{gap:11px 12px;margin-bottom:22px}.stat{padding:7px 8px;column-gap:4px;grid-template-columns:24px 1fr;grid-template-rows:16px 28px;border-radius:20px}.stat svg{width:23px;height:25px}.stat dt{font-size:11px}.stat dd{font-size:24px}.stat:last-child dd{font-size:18px}#share{margin-top:13px;min-height:44px}
}
#combo.compact{font-size:28px;min-width:46px;padding:4px 6px 6px}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="game" data-screen="title">
<div id="hud" aria-label="戦闘ステータス">
<div class="hearts" id="hearts" aria-label="残りハート3">♥♥♥</div>
<div class="score" id="scoreBadge" aria-label="破壊数"><b id="destruction">00</b></div>
<div class="timer" id="timer" aria-label="残り時間">75<small>秒</small></div>
<div class="tools"><button id="mute" aria-label="音を切り替える" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9 H8 L13 5 V19 L8 15 H4 Z"/><path class="sound-on" d="M17 8 Q22 12 17 16"/><path class="sound-off" d="M17 9 L22 15 M22 9 L17 15"/></svg></button><button id="pause" aria-label="一時停止">Ⅱ</button></div>
<div class="health"><div class="health-title"><span id="phaseLabel">第1形態</span><span id="hpText">2600</span></div><div class="track"><i id="hpBar"></i></div></div>
<div class="zone" id="zone" data-zone="front">正面 ×1.35</div></div>
<section id="stage" aria-label="3Dアリーナ"><div id="world"></div><span id="combo" hidden>0</span><div class="stun" aria-label="気絶ゲージ"><span aria-hidden="true">✦</span><div class="track"><i id="stunBar" style="width:0"></i></div></div><div id="enemyCue"></div><div id="floaters" class="floaters"></div><div id="callout" hidden></div><div id="stamp" hidden>つよい</div></section>
<nav id="controls" aria-label="ゲーム操作"><div class="gauge-row" aria-label="必殺ゲージ"><svg class="moon-icon" viewBox="0 0 26 28" aria-hidden="true"><path d="M20 3 A11 11 0 1 0 23 22 A12 12 0 0 1 20 3Z"/></svg><div class="track"><i id="gaugeBar" style="width:0"></i></div><span id="gaugeText">0%</span></div><button id="special" aria-label="必殺・月面アッパー" hidden><svg viewBox="0 0 100 100" aria-hidden="true"><defs><clipPath id="specialStar"><path d="M46 7 Q50 -1 54 7 L65 28 L88 31 Q99 32 91 41 L75 59 L79 84 Q81 95 71 89 L50 78 L28 89 Q18 95 21 84 L25 59 L8 41 Q1 32 12 31 L35 28Z"/></clipPath></defs><rect width="100" height="100" clip-path="url(#specialStar)"/><path fill="none" d="M46 7 Q50 -1 54 7 L65 28 L88 31 Q99 32 91 41 L75 59 L79 84 Q81 95 71 89 L50 78 L28 89 Q18 95 21 84 L25 59 L8 41 Q1 32 12 31 L35 28Z"/></svg><strong>必殺</strong></button><div class="attacks"><button class="attack" id="dash"><span class="symbol" aria-hidden="true"><svg viewBox="0 0 34 26"><path fill="#fff7e6" d="M14 4 Q13 1 17 3 L30 11 Q34 13 30 16 L17 23 Q13 25 14 21 L17 15 H5 Q1 13 5 11 H17 Z"/><path d="M3 5 H9 M2 21 H8"/></svg></span><strong>つっこみ</strong><i class="cool" style="transform:scaleY(0)"></i></button><button class="attack" id="slap"><span class="symbol" aria-hidden="true"><svg viewBox="0 0 34 26"><path fill="#fff7e6" d="M11 24 Q5 9 8 3 Q12 -2 15 4 L17 19 Q18 4 23 2 Q28 1 26 9 L22 24 Z"/><path stroke="#fa78a6" d="M11 6 L14 17 M23 6 L20 17"/></svg></span><strong>みみビンタ</strong><i class="cool" style="transform:scaleY(0)"></i></button><button class="attack" id="cannon"><span class="symbol" aria-hidden="true"><svg viewBox="0 0 34 26"><path fill="#fff7e6" d="M20 8 Q29 11 22 17 L8 24 Q4 25 6 21 L14 8 Q17 5 20 8Z"/><path fill="#ffdf61" d="M21 8 Q18 0 22 2 L25 6 Q31 0 32 4 L27 9Z"/><path d="M12 13 L15 16 M9 19 L11 20"/></svg></span><strong>にんじん砲</strong><span id="cannonHint" hidden></span><i class="cool" style="transform:scaleY(0)"></i></button></div><div class="orbit-row"><button class="orbit" id="left" <script>
'use strict';
window.onerror=(message,source,line,column)=>{const e=document.getElementById('error');e.hidden=false;e.textContent=String(message)+' @'+line+':'+column;};
window.addEventListener('unhandledrejection',e=>window.onerror(String(e.reason)));
// ENGINE_START — renderer-independent, shared by the game and the deterministic checks.
const TAU=Math.PI*2, DEG=Math.PI/180;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const wrap=a=>Math.atan2(Math.sin(a),Math.cos(a));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);
const direction=(a,b)=>Math.atan2(b.x-a.x,b.z-a.z);
const forward=(a)=>({x:Math.sin(a),z:Math.cos(a)});
const zoneFor=(facing,angle)=>{const degrees=Math.abs(wrap(angle-facing))/DEG;return degrees<=50?'front':degrees<=130?'side':'back';};
const ZONE_DAMAGE={front:1.35,side:1,back:1.15};
class ArenaGame{
 constructor(){this.muted=false;this.events=[];this.reset(false);}
 emit(type,data={}){this.events.push({type,t:this.s.elapsed,...data});}
 reset(play=true){
  this.events=[];this.s={phase:play?'playing':'title',paused:false,hp:2600,maxHp:2600,hearts:3,time:75,elapsed:0,wallElapsed:0,gorillaPhase:1,gauge:0,stun:0,dizzy:0,destruction:0,combo:0,maxCombo:0,hits:0,counters:0,damage:0,misses:0,aggro:0,invincible:0,flat:0,orbitGrace:0,hitstop:0,slow:0,slowScale:1,transition:0,transitionPhase:0,finishTime:0,result:null,phaseAttacks:0,treeWeapon:false,treeSource:null,cracks:0,rimCollapsed:false,cooldowns:{dash:0,slap:0,cannon:0},attack:null,orbit:null,projectiles:[],waves:[],lastDamage:null,lastHit:null,history:[],peakTravel:0};
  this.g={x:0,z:0,y:0,facing:0,vx:0,vz:0,vy:0,mode:'idle',timer:1.7,recover:0,attackId:0,lockedFacing:0,chargeDir:null,chargeHit:false,double:false,launchCause:null};
  this.r={x:0,z:3.4,y:0,angle:0,face:Math.PI};this.props=[];
  for(let i=0;i<5;i++){let a=(i/5)*TAU+.3;this.props.push({id:'tree'+i,kind:'tree',x:Math.sin(a)*6.7,z:Math.cos(a)*6.7,hp:75,maxHp:75,alive:true,radius:.7});}
  for(let i=0;i<9;i++){let a=(i/9)*TAU+.1,r=i%2?7.5:5.2;this.props.push({id:'rock'+i,kind:'rock',x:Math.sin(a)*r,z:Math.cos(a)*r,hp:45,maxHp:45,alive:true,radius:.6});}
  for(let i=0;i<4;i++){let a=i*Math.PI/2+.65;this.props.push({id:'pillar'+i,kind:'pillar',x:Math.sin(a)*8,z:Math.cos(a)*8,hp:100,maxHp:100,alive:true,radius:.65});}
  this.emit('reset');
 }
 get zone(){return zoneFor(this.g.facing,direction(this.g,this.r));}
 get busy(){return this.s.attack||this.s.flat>0||this.s.transition>0||this.s.phase!=='playing'||this.s.paused;}
 request(action){
  const s=this.s,g=this.g,r=this.r;if(s.phase!=='playing'||s.paused||s.transition>0||s.flat>0)return false;
  if(action==='left'||action==='right'){
   if(s.orbit||s.attack)return false;
   const start=direction(g,r),delta=(action==='right'?1:-1)*Math.PI/4;
   s.orbit={t:0,duration:.18,start,delta,radius:dist(g,r),cx:g.x,cz:g.z,fromX:r.x,fromZ:r.z};this.emit('orbit',{action});return true;
  }
  if(s.attack||s.orbit)return false;
  if(action==='special'){
   if(s.gauge<100)return false;s.gauge=0;s.attack={kind:'special',t:0,duration:.6,hit:false,dir:direction(r,g),x:r.x,z:r.z};s.invincible=Math.max(s.invincible,.8);this.emit('specialStart');return true;
  }
  if(!Object.hasOwn(s.cooldowns,action)||s.cooldowns[action]>0)return false;
  const dir=direction(r,g);r.face=dir;
  s.attack={kind:action,t:0,duration:action==='dash'?.28:action==='slap'?.42:1.1,hit:false,dir,x:r.x,z:r.z};
  if(action==='dash'){s.cooldowns.dash=.34;s.invincible=Math.max(s.invincible,.3);}
  if(action==='slap')s.cooldowns.slap=1.2;
  this.emit('attackStart',{kind:action});return true;
 }
 log(type,data={}){this.s.history.push({type,t:+this.s.elapsed.toFixed(3),...data});if(this.s.history.length>180)this.s.history.shift();}
 bonusSlow(scale,duration){this.s.slow=Math.max(this.s.slow,duration);this.s.slowScale=scale;}
 hitGorilla(base,kind,knock=0,hitAngle=null){
  const s=this.s,g=this.g;if(s.phase!=='playing'||s.hp<=0)return;
  const zone=zoneFor(g.facing,hitAngle===null?direction(g,this.r):hitAngle);
  const vulnerable=s.dizzy>0?1.5:g.mode==='recover'||g.mode==='knocked'?1.2:1;
  const amount=Math.round(base*ZONE_DAMAGE[zone]*vulnerable);s.hp=Math.max(0,s.hp-amount);s.damage+=amount;s.hits++;s.combo++;s.maxCombo=Math.max(s.maxCombo,s.combo);s.comboTime=2.5;
  const gain=(kind==='cannon'?8:kind==='slap'?3:kind==='special'?0:1)*(zone==='back'?2:1);s.gauge=clamp(s.gauge+gain,0,100);
  if(zone==='back')s.aggro=2;
  s.lastDamage={amount,base,kind,zone,multiplier:ZONE_DAMAGE[zone],vulnerable};this.log('hit',s.lastDamage);this.emit('hit',{...s.lastDamage,x:g.x,y:g.y+2.5,z:g.z});
  s.hitstop=kind==='cannon'?.085:kind==='special'?.12:.045;
  if(kind==='slap'&&s.dizzy<=0){s.stun=clamp(s.stun+34,0,100);if(s.stun>=100)this.makeDizzy(3,'ears');}
  if(knock>0){let d=forward(direction(this.r,g));g.vx=d.x*knock;g.vz=d.z*knock;g.vy=kind==='special'?14:kind==='cannon'?4:1.3;g.mode='knocked';g.launchCause=kind;g.timer=0;}
  if(s.hp<=0)this.finish('win',kind==='special');
 }
 makeDizzy(duration,cause){const s=this.s;s.dizzy=Math.max(s.dizzy,duration);s.stun=100;this.g.mode='dizzy';this.g.timer=0;this.emit('dizzy',{cause});this.log('dizzy',{duration,cause});}
 hurt(source,id){
  const s=this.s;if(s.phase!=='playing')return false;
  if(s.invincible>0){
   if(s.attack?.kind==='dash'&&s.attack.t<.16&&s.lastCounterId!==id){s.lastCounterId=id;s.counters++;this.bonusSlow(.25,.42);this.hitGorilla(30,'counter',0);s.gauge=clamp(s.gauge+10,0,100);this.emit('counter');this.log('counter',{source});}
   return false;
  }
  const charging=s.attack?.kind==='cannon';if(charging){s.attack=null;s.cooldowns.cannon=.6;this.emit('interrupted');this.log('interrupted',{gauge:s.gauge});}
  s.hearts--;s.combo=0;s.flat=.85;s.invincible=1.8;s.attack=null;s.orbit=null;s.lastHit={source,charging};this.emit('hurt',{source,charging,x:this.r.x,z:this.r.z});this.log('hurt',{source,hearts:s.hearts,charging});
  if(s.hearts<=0)this.finish('hearts');return true;
 }
 breakProp(p,cause,crash=false){
  if(!p.alive)return;p.alive=false;p.hp=0;this.s.destruction++;
  this.emit('break',{id:p.id,kind:p.kind,x:p.x,z:p.z,cause,crash});this.log('break',{id:p.id,cause,count:this.s.destruction});
  if(crash&&this.s.phase==='playing'){this.s.hp=Math.max(0,this.s.hp-25);this.s.damage+=25;this.emit('crash',{x:this.g.x,y:2,z:this.g.z,amount:25});if(this.s.hp===0)this.finish('win',false);}
  this.milestone();
 }
 damageProp(p,amount,cause,crash=false){if(!p.alive)return;p.hp-=amount;if(p.hp<=0)this.breakProp(p,cause,crash);else this.emit('propHit',{id:p.id});}
 milestone(){const n=this.s.destruction;if(n===5||n===10||n===15){if(n===10)this.s.time+=3;this.emit('milestone',{count:n});this.log('milestone',{count:n,time:this.s.time});}}
 addCrack(counted){this.s.cracks++;if(counted){this.s.destruction++;this.milestone();}this.emit('crack',{x:this.g.x,z:this.g.z,index:this.s.cracks,counted});this.log('crack',{counted});}
 transition(next){
  const s=this.s,g=this.g;s.gorillaPhase=next;s.transition=1.3;s.transitionPhase=next;s.phaseAttacks=0;s.attack=null;s.orbit=null;s.dizzy=0;s.stun=0;g.mode='transition';g.vx=g.vz=g.vy=0;g.y=0;this.bonusSlow(.3,.5);
  if(next===2){s.treeWeapon=true;const p=this.props.filter(p=>p.alive&&p.kind==='tree').sort((a,b)=>dist(g,a)-dist(g,b))[0];if(p){s.treeSource=p.id;this.breakProp(p,'rip');}}
  if(next===3){s.rimCollapsed=true;for(let i=0;i<4;i++)this.addCrack(false);}
  this.emit('transition',{phase:next});this.log('transition',{phase:next,hp:s.hp});
 }
 startEnemyAttack(){
  const s=this.s,g=this.g;s.phaseAttacks++;let kind='slam';
  if(s.gorillaPhase===2)kind=s.phaseAttacks%2===1?'charge':'swing';
  if(s.gorillaPhase===3)kind=['wave','double','charge','swing'][(s.phaseAttacks-1)%4];
  g.mode='tell';g.attackKind=kind;g.timer=kind==='charge'?.95:kind==='wave'?.85:.8;g.tellDuration=g.timer;g.lockedFacing=kind==='charge'?direction(g,this.r):g.facing;g.attackId++;g.chargeHit=false;g.double=false;
  this.emit('telegraph',{kind});this.log('enemyAttack',{kind,phase:s.gorillaPhase});
 }
 slam(kind){const g=this.g,s=this.s;const arc=kind==='swing'?108:50,reach=kind==='swing'?5.5:4.45,id='slam'+g.attackId+(g.double?'b':'a');
  if(dist(g,this.r)<=reach&&Math.abs(wrap(direction(g,this.r)-g.lockedFacing))<=arc*DEG)this.hurt(kind,id);
  for(const p of this.props){if(p.alive&&dist(g,p)<reach+p.radius&&Math.abs(wrap(direction(g,p)-g.lockedFacing))<arc*DEG)this.damageProp(p,90,'slam');}
  this.emit('slam',{x:g.x,z:g.z,kind});
 }
 finish(reason,moon=false){const s=this.s;if(s.phase!=='playing')return;s.phase=reason==='win'?'finishing':'result';s.result=reason;s.attack=null;s.orbit=null;s.projectiles=[];s.waves=[];s.finishTime=0;this.log('result',{reason,elapsed:s.elapsed});
  if(reason==='win'){s.moon=moon;this.bonusSlow(.2,.6);this.g.vy=moon?25:15;this.g.vx=moon?1:3;this.g.vz=-3;this.g.mode='finale';this.emit('finish',{moon});}else this.emit('result',{reason});
 }
 update(realDt){
  const s=this.s,g=this.g,r=this.r;const clockDt=realDt;realDt=Math.min(realDt,.05);if(s.paused||s.phase==='title'||s.phase==='result')return;
  s.wallElapsed+=clockDt;
  if(s.phase==='playing'){s.time=Math.max(0,s.time-clockDt);if(s.time===0){this.finish('timeout');return;}}
  s.slow=Math.max(0,s.slow-realDt);const scale=s.slow>0?s.slowScale:1;let dt=realDt*scale;
  if(s.hitstop>0){s.hitstop=Math.max(0,s.hitstop-realDt);dt=0;}
  if(s.phase==='finishing'){s.finishTime+=realDt;g.y+=g.vy*dt;g.vy-=s.moon?2*dt:5*dt;g.x+=g.vx*dt;g.z+=g.vz*dt;if(s.finishTime>2.5){s.phase='result';this.emit('result',{reason:'win'});}return;}
  s.elapsed+=dt;for(const k of ['aggro','invincible','flat','orbitGrace'])s[k]=Math.max(0,s[k]-dt);for(const k of Object.keys(s.cooldowns))s.cooldowns[k]=Math.max(0,s.cooldowns[k]-dt);
  if(s.comboTime>0){s.comboTime-=dt;if(s.comboTime<=0)s.combo=0;}
  if(s.transition>0){s.transition-=dt;if(s.transition<=0){g.mode='idle';g.timer=.75;}return;}
  const next=s.hp<=2600*.33?3:s.hp<=2600*.66?2:1;if(next>s.gorillaPhase){this.transition(s.gorillaPhase+1);return;}
  if(s.orbit){const o=s.orbit;o.t+=dt;const k=clamp(o.t/o.duration,0,1),e=k*k*(3-2*k),a=o.start+o.delta*e;r.x=o.cx+Math.sin(a)*(o.radius+(3.4-o.radius)*e);r.z=o.cz+Math.cos(a)*(o.radius+(3.4-o.radius)*e);r.y=Math.sin(k*Math.PI)*.65;r.angle=a;r.face=direction(r,g);if(k===1){s.orbit=null;s.orbitGrace=.28;r.y=0;}}
  else if(!s.attack&&s.flat<=0){const a=direction(g,r),target={x:g.x+Math.sin(a)*3.4,z:g.z+Math.cos(a)*3.4};const d=dist(r,target),step=Math.min(d,dt*(g.mode==='knocked'||g.mode==='charge'?1.8:3.6));if(d>.001){r.x+=(target.x-r.x)*step/d;r.z+=(target.z-r.z)*step/d;}r.angle=direction(g,r);r.face=direction(r,g);r.y=0;}
  if(s.attack){const a=s.attack;a.t+=dt;
   if(a.kind==='dash'){const v=forward(a.dir),k=clamp(a.t/a.duration,0,1),travel=Math.sin(k*Math.PI)*2.1;r.x=a.x+v.x*travel;r.z=a.z+v.z*travel;r.y=Math.sin(k*Math.PI)*.35;
    if(!a.hit&&a.t>=.095){a.hit=true;if(dist(r,g)<2.35&&g.y<2.5)this.hitGorilla(14,'dash');else this.miss(a.kind);}}
   if(a.kind==='slap'&&!a.hit&&a.t>=.15){a.hit=true;const aim=wrap(direction(r,g)-a.dir);if(dist(r,g)<4.4&&Math.abs(aim)<55*DEG&&g.y<2.6)this.hitGorilla(34,'slap');else this.miss(a.kind);}
   if(a.kind==='special'&&!a.hit&&a.t>=.18){a.hit=true;if(dist(r,g)<5.4&&g.y<4){this.hitGorilla(290,'special',16);this.bonusSlow(.3,.45);for(const p of this.props)if(p.alive&&dist(g,p)<3.2)this.damageProp(p,160,'special',true);}else this.miss(a.kind);}
   if(a.t>=a.duration&&s.attack===a){if(a.kind==='cannon'){const d=forward(a.dir);s.projectiles.push({x:r.x+d.x*.7,z:r.z+d.z*.7,dx:d.x,dz:d.z,age:0,hit:false,originAngle:direction(g,r)});s.cooldowns.cannon=2.5;this.emit('cannonFire',{x:r.x,z:r.z,dir:a.dir});}if(a.kind==='dash'){r.x=a.x;r.z=a.z;}r.y=0;s.attack=null;}
  }
  for(let i=s.projectiles.length-1;i>=0;i--){const p=s.projectiles[i],old={x:p.x,z:p.z};p.age+=dt;p.x+=p.dx*24*dt;p.z+=p.dz*24*dt;
   const dseg=this.segmentDistance(g,old,p);
   if(!p.hit&&g.y<3&&dseg<1.55){p.hit=true;this.hitGorilla(120,'cannon',8.5,p.originAngle);this.emit('blast',{x:g.x,z:g.z});for(const prop of this.props)if(prop.alive&&dist(g,prop)<3.2)this.damageProp(prop,100,'cannon',false);}
   for(const prop of this.props)if(prop.alive&&this.segmentDistance(prop,old,p)<prop.radius+.75){this.damageProp(prop,100,'cannon');this.emit('blast',{x:prop.x,z:prop.z});p.hit=true;}
   if(p.hit||p.age>1.2){if(!p.hit)this.miss('cannon');s.projectiles.splice(i,1);}
  }
  if(s.phase!=='playing')return;
  if(g.mode==='knocked'){
   const before={x:g.x,z:g.z};g.x+=g.vx*dt;g.z+=g.vz*dt;g.y+=g.vy*dt;g.vy-=20*dt;g.vx*=Math.exp(-1.1*dt);g.vz*=Math.exp(-1.1*dt);
   for(const p of this.props)if(p.alive&&this.segmentDistance(p,before,g)<1.25+p.radius&&g.y<5)this.damageProp(p,130,'collision',true);
   const radius=Math.hypot(g.x,g.z);s.peakTravel=Math.max(s.peakTravel,dist(before,g));if(radius>7.9){g.x*=7.9/radius;g.z*=7.9/radius;g.vx*=-.35;g.vz*=-.35;}
   if(g.y<=0){g.y=0;g.vy=0;if(s.gorillaPhase===3&&g.launchCause&&(g.launchCause==='cannon'||g.launchCause==='special')){this.addCrack(true);g.launchCause=null;}if(Math.hypot(g.vx,g.vz)<2.5){g.mode=s.dizzy>0?'dizzy':'recover';g.timer=1.1;g.vx=g.vz=0;}}
  }else if(s.dizzy>0){g.mode='dizzy';}
  else if(g.mode==='recover'){g.timer-=dt;if(g.timer<=0){g.mode='idle';g.timer=.6;}}
  else if(g.mode==='charge'){
   const before={x:g.x,z:g.z};g.x+=g.chargeDir.x*13.5*dt;g.z+=g.chargeDir.z*13.5*dt;g.timer-=dt;
   if(!g.chargeHit&&this.segmentDistance(r,before,g)<1.35){g.chargeHit=true;this.hurt('charge','charge'+g.attackId);}
   for(const p of this.props)if(p.alive&&this.segmentDistance(p,before,g)<p.radius+1.25){this.damageProp(p,160,'charge',true);this.makeDizzy(1.5,'crash');break;}
   const radial=Math.hypot(g.x,g.z);if(radial>7.8){g.x*=7.8/radial;g.z*=7.8/radial;this.makeDizzy(1.1,'rim');}
   else if(g.timer<=0){g.mode='recover';g.timer=.85;}
  }else if(g.mode==='tell'){
   g.timer-=dt;if(g.timer<=0){
    if(g.attackKind==='charge'){g.mode='charge';g.timer=.8;g.chargeDir=forward(g.lockedFacing);this.emit('charge');}
    else if(g.attackKind==='wave'){s.waves.push({x:g.x,z:g.z,radius:.1,hit:false,id:'wave'+g.attackId});g.mode='recover';g.timer=1.1;this.emit('wave');}
    else {this.slam(g.attackKind);if(g.attackKind==='double'&&!g.double){g.double=true;g.timer=.38;g.attackKind='double';this.emit('doubleWarning');}else {g.mode='recover';g.timer=s.gorillaPhase===1?.95:.75;}}
   }
  }else if(g.mode==='idle'){
   let target=direction(g,r),speed=[0,.55,.9,1.25][s.gorillaPhase]*(s.aggro>0?2.3:1);g.facing+=clamp(wrap(target-g.facing),-speed*dt,speed*dt);
   const d=dist(g,r);if(d>2.9){const v=forward(target),speed=[0,.38,.6,.8][s.gorillaPhase];g.x+=v.x*speed*dt;g.z+=v.z*speed*dt;}
   g.timer-=dt;if(g.timer<=0)this.startEnemyAttack();
  }
  if(s.dizzy>0){s.dizzy=Math.max(0,s.dizzy-dt);if(s.dizzy===0){s.stun=0;if(g.mode==='dizzy'){g.mode='recover';g.timer=.65;}}}
